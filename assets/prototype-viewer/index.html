<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2537b8"/>
  <title>AI原型生成器</title>
  <link rel="icon" type="image/svg+xml" href="assets/prototype-viewer/prototype-mark.svg"/>
  <link rel="stylesheet" href="viewer.css?v=20261016-8"/>
  <link rel="stylesheet" href="select-controls.css?v=20261016-3"/>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-panels" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="icon-inspector" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="icon-page" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="icon-flow" viewBox="0 0 24 24"><rect x="3" y="8" width="5" height="8" rx="1"/><rect x="16" y="3" width="5" height="6" rx="1"/><rect x="16" y="15" width="5" height="6" rx="1"/><path d="M8 12h4V6h4m-4 6v6h4"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 4 13 8-13 8z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="icon-fit" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="7" y="7" width="10" height="10" rx="1"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="m9 15 6-6m-7 7-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 10a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1" transform="translate(1 0) scale(.92)"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m4 0h1m4 0h1M6 12h1m4 0h1m4 0h1M7 16h10"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup"><img class="brand-mark" src="assets/prototype-viewer/prototype-mark.svg" alt="PRD to Prototype"/><div class="brand-copy"><strong>AI原型生成器</strong><span>PRD to Prototype</span></div></div>
      <div class="topbar-main">
        <button type="button" id="toggleSidebar" class="icon-button" aria-label="切换页面导航" aria-expanded="true" aria-controls="sidebar" title="切换页面导航"><svg class="icon"><use href="#icon-panels"/></svg></button>
        <div class="view-switch" role="group" aria-label="查看方式"><button type="button" id="pageModeButton" class="is-active" aria-pressed="true" aria-label="页面审阅" title="页面审阅"><svg class="icon"><use href="#icon-page"/></svg><span>页面审阅</span></button><button type="button" id="overviewNav" class="overview-nav" aria-pressed="false" aria-label="流程总览" title="流程总览"><svg class="icon"><use href="#icon-flow"/></svg><span>流程总览</span></button></div>
        <div id="desktopTools" class="desktop-tools"><div id="advancedTools" class="advanced-tools">
          <div class="canvas-tools toolbar" role="group" aria-label="画布工具栏"><button type="button" data-zoom="out" aria-label="缩小" title="缩小（−）">−</button><div class="zoom-picker"><button type="button" id="zoomMenuButton" class="zoom-menu-button" aria-label="选择画布缩放比例" aria-haspopup="menu" aria-expanded="false"><span id="zoomValue">适应</span><svg class="small-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><div id="zoomMenu" class="zoom-menu" role="menu" popover="manual" hidden><button type="button" role="menuitem" data-zoom-level="0.25">25%</button><button type="button" role="menuitem" data-zoom-level="0.5">50%</button><button type="button" role="menuitem" data-zoom-level="0.75">75%</button><button type="button" role="menuitem" data-zoom-level="1">100%</button><button type="button" role="menuitem" data-zoom-level="1.25">125%</button><button type="button" role="menuitem" data-zoom-level="1.5">150%</button><button type="button" role="menuitem" data-zoom-level="2">200%</button></div></div><button type="button" data-zoom="in" aria-label="放大" title="放大（+）">＋</button><span class="tool-divider"></span><button type="button" id="fitButton" class="icon-button" aria-label="适应画布" title="适应画布（0）"><svg class="icon"><use href="#icon-fit"/></svg></button></div>
        </div></div>
        <div class="topbar-actions"><button type="button" id="toggleInspector" class="icon-button is-active" aria-label="切换页面说明" aria-expanded="true" aria-controls="inspector" title="切换页面说明"><svg class="icon"><use href="#icon-inspector"/></svg></button><button type="button" id="copyLinkButton" class="icon-button" aria-label="复制当前页面链接" title="复制当前页面链接"><svg class="icon"><use href="#icon-link"/></svg></button><button id="moreToolsButton" type="button" class="icon-button" popovertarget="moreTools" aria-label="更多操作" aria-expanded="false" title="更多操作"><svg class="icon"><use href="#icon-more"/></svg></button></div>
      </div>
      <button type="button" id="runPrototypeButton" class="primary-button" aria-label="运行原型" title="运行原型（Alt Enter）"><svg class="icon"><use href="#icon-play"/></svg><span>运行原型</span></button>
      <div id="moreTools" class="more-tools" popover aria-label="更多工作台操作"><div id="compactTools" class="compact-tools"></div></div>
    </header>
    <aside class="sidebar" id="sidebar" aria-label="页面导航">
      <div class="sidebar-search-row"><label class="search-box"><svg class="icon"><use href="#icon-search"/></svg><input id="pageSearch" type="search" placeholder="搜索页面…" aria-label="搜索页面" autocomplete="off"/><kbd>/</kbd></label><button type="button" id="closeSidebar" class="icon-button drawer-close" aria-label="关闭页面导航"><svg class="icon"><use href="#icon-close"/></svg></button></div>
      <nav id="pageNav" class="page-nav" aria-label="原型页面目录"></nav>
    </aside>
    <section class="stage-shell" aria-label="原型画布工作区">
      <span id="activePageTitle" class="sr-only" aria-live="polite">正在打开项目</span>
      <main class="workspace" id="workspace" tabindex="0" aria-label="原型画布"><div class="canvas-sizer" id="canvasSizer"><section class="canvas" id="canvas" aria-label="自动流程画布"><svg class="connections" id="connections" aria-hidden="true"></svg><div id="flow" class="flow"></div></section></div></main>
    </section>
    <aside class="inspector" id="inspector" aria-label="页面说明"><div class="inspector-empty"><svg class="icon"><use href="#icon-flow"/></svg><strong>查看完整页面流程</strong><p>选择任一页面，查看概要、标注与交付说明。</p></div></aside>
    <footer class="statusbar"><div class="annotation-storage-status" data-state="loading" role="status" aria-live="polite"><i aria-hidden="true"></i><span>正在读取项目</span></div><div class="statusbar-right"><span class="canvas-hint" id="canvasHint"></span><span id="pagePosition">…</span><button id="shortcutsButton" type="button" class="shortcut-link" aria-label="查看快捷键" title="查看快捷键（?）"><svg class="icon"><use href="#icon-keyboard"/></svg><span>快捷键</span><kbd>?</kbd></button></div></footer>
    <button class="panel-backdrop" id="panelBackdrop" type="button" aria-label="关闭侧边面板" hidden></button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="controlTooltip" class="quick-tooltip" role="tooltip" popover="manual" hidden></div>
  <dialog id="previewDialog" class="preview-dialog" aria-labelledby="previewTitle"><div class="preview-topbar"><div class="preview-label"><span class="preview-indicator"></span><strong id="previewTitle">页面预览</strong><span>运行预览</span></div><div class="preview-actions"><button type="button" id="openNewWindow">在新窗口打开 ↗</button><button type="button" id="closePreview" class="icon-button" aria-label="关闭运行预览" title="关闭运行预览（Esc）"><svg class="icon"><use href="#icon-close"/></svg></button></div></div><div id="previewViewport" class="preview-viewport"><div id="previewDevice" class="preview-device"><iframe id="previewFrame" title="原型运行预览"></iframe></div></div></dialog>
  <dialog id="shortcutsDialog" class="shortcuts-dialog" aria-labelledby="shortcutsTitle"><div class="shortcuts-heading"><h2 id="shortcutsTitle">工作台快捷键</h2><button id="closeShortcuts" type="button" class="icon-button" aria-label="关闭快捷键说明"><svg class="icon"><use href="#icon-close"/></svg></button></div><dl><div><dt>搜索页面</dt><dd><kbd>/</kbd> 或 <kbd>⌘ / Ctrl K</kbd></dd></div><div><dt>适应画布</dt><dd><kbd>0</kbd></dd></div><div><dt>原始比例</dt><dd><kbd>1</kbd></dd></div><div><dt>放大 / 缩小</dt><dd><kbd>+</kbd> / <kbd>−</kbd></dd></div><div><dt>运行原型</dt><dd><kbd>Alt Enter</kbd></dd></div><div><dt>显示 / 隐藏标注</dt><dd><kbd>M</kbd></dd></div><div><dt>取消标注操作 / 关闭预览</dt><dd><kbd>Esc</kbd></dd></div></dl><p>输入文字时不触发画布快捷键。</p></dialog>
  <template id="pageNodeTemplate"><article class="page-node"><div class="node-head"><div><span class="node-index"></span><strong class="node-title"></strong><span class="node-module"></span></div><div class="node-actions"><button type="button" class="run-button" aria-label="运行此页面"><svg class="icon"><use href="#icon-play"/></svg></button></div></div><div class="node-body"><div class="screen-stage"><div class="screen-frame"><iframe loading="lazy" title="页面预览"></iframe><span class="viewport-label">1440 × 900 · WEB</span></div></div>
    <aside class="annotation-card"><button type="button" class="icon-button close-inspector" aria-label="关闭页面说明"><svg class="icon"><use href="#icon-close"/></svg></button><div class="handoff-tabs" role="tablist" aria-label="页面说明分类"><button type="button" class="is-active" role="tab" aria-selected="true" data-handoff-tab="overview">概要</button><button type="button" role="tab" aria-selected="false" data-handoff-tab="annotations">标注 <span class="tab-marker-count"></span></button><button type="button" role="tab" aria-selected="false" data-handoff-tab="states">状态</button><button type="button" role="tab" aria-selected="false" data-handoff-tab="delivery">交付</button></div>
      <div class="handoff-panel is-active" role="tabpanel" data-handoff-panel="overview"></div><div class="handoff-panel" role="tabpanel" data-handoff-panel="annotations"><div class="annotation-head"><span class="annotation-count"></span><span class="annotation-controls"><label class="marker-toggle" title="显示或隐藏页面编号标记"><span>编号</span><input type="checkbox" checked aria-label="显示页面编号标记"/><i aria-hidden="true"></i></label><button type="button" class="annotation-add-button" title="在页面上添加标记" aria-label="在页面上添加标记" aria-pressed="false"><span aria-hidden="true">＋</span><b>标记</b></button></span></div><div class="annotation-storage-status" data-state="loading"><i aria-hidden="true"></i><span>读取保存状态</span></div><div class="annotation-list"></div></div><div class="handoff-panel" role="tabpanel" data-handoff-panel="states"></div><div class="handoff-panel" role="tabpanel" data-handoff-panel="delivery"></div>
    </aside></div>
  </article></template>
  <script src="annotation-store.js?v=20261016-1"></script><script src="document-preview-core.js?v=20260819-1"></script><script src="viewer.js?v=20261017-1"></script>
</body>
</html>
