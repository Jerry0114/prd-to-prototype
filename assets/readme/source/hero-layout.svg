  <path d="M56 788H1144" stroke="#E1E6F0" stroke-width="1.5"/>
  <g id="feature-cues" font-size="24" font-weight="600" fill="#172777">
    <text x="56" y="830">需求有据可查</text>
    <text x="344" y="830">两次人工确认</text>
    <text x="632" y="830">多页面可交互</text>
    <text x="920" y="830">标注与说明随附</text>
  </g>
